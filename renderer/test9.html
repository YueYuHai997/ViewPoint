<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ViewPoint - 三维战场态势</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div id="toolbar"></div>
    <div id="main-content">
      <div id="left-panel"></div>
      <div id="scene-container" style="min-width:100px;min-height:100px;"></div>
      <div id="right-panel"></div>
    </div>
    <div id="log-panel"></div>
    <div id="status-bar">
      <span id="update-rate">更新频率: --</span>
      <span id="total-vehicles">车辆总数: 0</span>
    </div>
  </div>
  <script>
    window.onerror = (msg, src, line, col, err) => {
      document.title = 'ERROR: ' + msg;
    };
    try {
      require('./app.js');
    } catch (e) {
      document.title = 'CATCH: ' + e.message;
    }
  </script>
</body>
</html>
